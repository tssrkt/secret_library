<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Администрирование — Тайная Библиотека</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}main{max-width:1180px;margin:auto;padding:24px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:1.7rem;margin:0}p{line-height:1.5}.muted{opacity:.72}.toolbar,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,input,textarea{font:inherit;padding:9px 12px;border:1px solid #8888;border-radius:8px;background:Canvas;color:CanvasText}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#315c49;color:white;border-color:#315c49}.danger{border-color:#b44;color:#b44}.panel{border:1px solid #8885;border-radius:12px;padding:16px;margin:16px 0;overflow:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{padding:14px;border:1px solid #8885;border-radius:10px}.stat strong{display:block;font-size:1.6rem}.tabs button[aria-pressed=true]{border-color:#315c49;font-weight:700}table{border-collapse:collapse;width:100%;font-size:.94rem}th,td{text-align:left;padding:10px;border-bottom:1px solid #8884;vertical-align:top}th{white-space:nowrap}td small{display:block;opacity:.7;overflow-wrap:anywhere}.notice{padding:12px;border-radius:8px;background:#8881}.hidden{display:none!important}.actions{display:flex;gap:6px;flex-wrap:wrap}.relationship{margin:4px 0}.error{color:#b44}a{color:inherit}
</style>
</head>
<body><main>
<header><div><h1>Администрирование</h1><p class="muted">Тайная Библиотека · управление участниками и доступом</p></div><a href="./">← Вернуться в библиотеку</a></header>
<section id="auth" class="panel"><p>Войдите в Google под назначенным администраторским аккаунтом.</p><button id="login" class="primary">Войти через Google</button></section>
<section id="dashboard" class="hidden"><div id="status" class="notice" role="status">Загружаем данные…</div><div id="stats" class="stats"></div><nav id="tabs" class="tabs" aria-label="Разделы администрирования"></nav><section id="content" class="panel"></section></section>
</main><script type="module" src="./js/admin.js"></script></body></html>
