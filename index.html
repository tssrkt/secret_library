<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тайная Библиотека</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="branding">
        <h1>Тайная Библиотека</h1>
        <p class="subtitle">Личная библиотека из Google Drive</p>
      </div>
      <div class="account-actions">
        <button id="sign-in-button" type="button">Войти через Google</button>
        <div id="user-controls" class="user-controls" hidden>
          <button id="avatar-button" class="avatar-button" type="button" aria-label="Открыть меню пользователя" aria-haspopup="menu" aria-expanded="false">
            <span id="avatar-placeholder" aria-hidden="true">☺</span>
            <img id="avatar-image" alt="" hidden>
          </button>
          <div id="avatar-menu" class="avatar-menu" role="menu" hidden>
            <button type="button" role="menuitem" disabled title="Будет доступно позже">Мой профиль <small>Будет позже</small></button>
            <hr>
            <button id="refresh-button" type="button" role="menuitem">Обновить библиотеку</button>
            <button id="metadata-button" type="button" role="menuitem" hidden>Проиндексировать книги</button>
            <button id="retry-metadata-button" type="button" role="menuitem" hidden>Повторить ошибки</button>
            <hr>
            <button type="button" role="menuitem" disabled title="Будет доступно позже">Настройки <small>Будет позже</small></button>
          </div>
        </div>
        <button id="sign-out-button" class="secondary" type="button" hidden>Выйти</button>
      </div>
    </header>

    <section id="status-panel" class="status-panel" aria-live="polite">
      <p id="status-text">Для доступа к библиотеке войдите через Google.</p>
      <dl id="stats" hidden>
        <div><dt>Папок</dt><dd id="folder-count">0</dd></div>
        <div><dt>Книг</dt><dd id="book-count">0</dd></div>
      </dl>
      <button id="stop-button" class="danger stop-button" type="button" hidden>Остановить</button>
    </section>

    <section id="error-panel" class="error-panel" role="alert" hidden>
      <p id="error-text"></p>
      <button id="retry-button" type="button" hidden>Построить индекс заново</button>
    </section>

    <section id="library-panel" aria-label="Структура библиотеки" hidden>
      <div id="library-tree" class="library-tree"></div>
    </section>

    <aside id="book-details" class="book-details" aria-labelledby="details-title" hidden>
      <div class="details-header">
        <h2 id="details-title">Сведения о книге</h2>
        <button id="close-details-button" class="secondary compact" type="button" aria-label="Закрыть">×</button>
      </div>
      <dl class="details-list">
        <div><dt>Название</dt><dd id="details-book-title"></dd></div>
        <div><dt>Автор</dt><dd id="details-authors"></dd></div>
        <div><dt>Серия</dt><dd id="details-series"></dd></div>
        <div><dt>Имя файла</dt><dd id="details-file-name"></dd></div>
        <div class="annotation"><dt>Аннотация</dt><dd id="details-annotation"></dd></div>
      </dl>
    </aside>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
