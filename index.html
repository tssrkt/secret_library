<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тайная Библиотека</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="branding">
        <h1><a id="library-home-link" href="./" aria-label="Вернуться к главной библиотеке">Тайная Библиотека</a></h1>
        <p class="subtitle">Личная библиотека из Google Drive</p>
      </div>
      <div class="account-actions">
        <button id="sign-in-button" type="button">Войти через Google</button>
        <button id="book-search-button" class="search-icon-button" type="button" aria-label="Поиск книг" aria-expanded="false" aria-controls="quick-search-form" disabled hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        </button>
        <div id="notification-controls" class="notification-controls" hidden>
          <button id="notifications-button" class="search-icon-button notification-button" type="button" aria-label="Уведомления" aria-expanded="false" aria-controls="notifications-panel">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            <span data-notification-badge class="notification-badge" aria-hidden="true" hidden></span>
          </button>
          <div id="notifications-panel" class="notifications-panel" aria-label="Уведомления" hidden></div>
        </div>
        <div id="user-controls" class="user-controls" hidden>
          <button id="avatar-button" class="avatar-button" type="button" aria-label="Открыть меню пользователя" aria-haspopup="menu" aria-expanded="false">
            <span id="avatar-placeholder" aria-hidden="true">☺</span>
            <img id="avatar-image" alt="" hidden>
          </button>
          <div id="avatar-menu" class="avatar-menu" role="menu" hidden>
            <div class="account-identity">
              <strong id="account-display-name">Пользователь Google</strong>
              <span id="account-email" hidden></span>
            </div>
            <hr>
            <button id="refresh-button" type="button" role="menuitem">Обновить библиотеку</button>
            <button id="metadata-button" type="button" role="menuitem" hidden>Переиндексировать книги</button>
            <button id="retry-metadata-button" type="button" role="menuitem" hidden>Повторить ошибки</button>
            <button id="settings-button" type="button" role="menuitem">Настройки</button>
            <hr class="account-menu-separator">
            <button id="sign-out-button" class="sign-out-menu-item" type="button" role="menuitem">Выйти</button>
          </div>
        </div>
      </div>
      <form id="quick-search-form" class="quick-search-form" role="search" inert>
        <input id="quick-search-input" type="text" aria-label="Общий запрос" autocomplete="off" placeholder="Поиск книг">
        <button id="advanced-search-button" class="advanced-search-link" type="button">Расширенный поиск</button>
      </form>
    </header>

    <section id="status-panel" class="status-panel" aria-live="polite">
      <p id="status-text">Для доступа к библиотеке войдите через Google.</p>
      <dl id="stats" hidden>
        <div><dt>Папок</dt><dd id="folder-count">0</dd></div>
        <div><dt>Книг</dt><dd id="book-count">0</dd></div>
      </dl>
      <button id="stop-button" class="danger stop-button" type="button" hidden>Остановить</button>
      <div id="indexing-errors" hidden>
        <span data-error-count></span>
        <button type="button" class="secondary" data-error-toggle aria-expanded="false" aria-controls="indexing-error-panel">Показать</button>
        <div id="indexing-error-panel" data-error-panel hidden>
          <ul data-error-list></ul>
          <p data-recovered-heading hidden>Восстановленные книги и предупреждения:</p>
          <ul data-recovered-list hidden></ul>
          <button type="button" class="secondary" data-error-copy>Скопировать ошибки</button>
          <button type="button" class="secondary" data-error-download>Скачать лог</button>
          <p role="status"></p>
          <textarea readonly hidden aria-label="Отчёт об ошибках для копирования"></textarea>
        </div>
      </div>
    </section>

    <section id="error-panel" class="error-panel" role="alert" hidden>
      <p id="error-text"></p>
      <button id="retry-button" type="button" hidden>Построить индекс заново</button>
    </section>

    <section id="library-panel" aria-label="Структура библиотеки" hidden>
      <div id="library-tree" class="library-tree"></div>
    </section>

    <div id="annotation-modal" class="modal-backdrop" hidden>
      <section class="annotation-modal" role="dialog" aria-modal="true" aria-labelledby="annotation-modal-title">
        <div id="annotation-modal-cover" class="annotation-modal-cover" aria-hidden="true">
          <div id="annotation-modal-cover-placeholder" class="annotation-modal-cover-placeholder">Нет обложки</div>
          <img id="annotation-modal-cover-image" alt="" hidden>
        </div>
        <div class="annotation-modal-content">
          <div class="modal-header">
            <h2 id="annotation-modal-title"></h2>
            <button id="annotation-modal-close" class="secondary compact" type="button" aria-label="Закрыть">×</button>
          </div>
          <p id="annotation-modal-genres" class="annotation-modal-genres"></p>
          <p id="annotation-modal-text"></p>
        </div>
      </section>
    </div>

  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
